name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions are pinned to commit SHAs (tags can move); bump on purpose
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Python tests (wizard against a mock engine, adoption, MCP, Strata checks)
        run: |
          export PYTHONDONTWRITEBYTECODE=1
          for t in tests/test_*.py; do echo "== $t"; python3 "$t" || exit 1; done
      - name: Extension tests (bun)
        run: bun test tests/
      - name: shellcheck (errors only; the existing warnings are tracked separately)
        run: shellcheck -S error setup.sh start.sh harness scripts/*.sh server/*.sh tests/*.sh

  install:
    # the whole installer, no GPU: setup.sh against a stub engine in a throwaway HOME (tests/e2e-setup.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: setup.sh end to end
        run: bash tests/e2e-setup.sh
